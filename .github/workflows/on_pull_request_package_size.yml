name: Package size

on: pull_request

jobs:
  package-size:
    name: Check package sizes
    runs-on: ubuntu-latest-large
    steps:
      - name: Checkout Repo
        uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744  # v3
        with:
          fetch-depth: 0

      - uses: nrwl/nx-set-shas@0e2d18b530b83b68263ff7b74e46b1ba300c83fc  # v3

      - name: Setup Node.js 20.5
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610  # v3
        with:
          node-version: 20.5.x

      - uses: zahnster/compressed-size-action@860a45a187454af776971b8f44a73973887fd394  # 2.4.2
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          build-script: "build:js"
          # only do common js files, no need to double count files
          pattern: "{**/dist/**/*.js,./packages/paste-icons/cjs/**/*.js}"
          exclude: "{**/*.map,**/node_modules/**,**/*.es.js,**/*.es6.js,**/*.debug.js,**/*.debug.es.js}"
