name: Opened Pull Request Labeler

on:
  pull_request:
    types: [opened]

jobs:
  pr-triage:
    runs-on: ubuntu-latest-large
    steps:
      - name: Auto labeller
        uses: actions/labeler@ac9175f8a1f3625fd0d4fb234536d26811351594  # v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/opened-pr-labeler.yml
      - name: Assign Author
        uses: technote-space/assign-author@9558557c5c4816f38bd06176fbc324ba14bb3160  # v1
